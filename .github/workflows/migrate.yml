name: Migrate DB
# Self-host fork uses local libsql via docker-compose (db-migrate service),
# so this never auto-runs. Manual fallback only for a hosted Turso database.
on:
  workflow_dispatch:
jobs:
  migrate:
    name: 🗃️ Migrate DB
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:  ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN:  ${{ secrets.DATABASE_AUTH_TOKEN }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26.8.1
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install

      - name: 🗃️ Run migrations
        run: pnpm migrate
        working-directory: ./packages/db
